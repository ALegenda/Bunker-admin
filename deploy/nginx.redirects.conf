# Installed separately as /etc/nginx/sites-available/bunker-redirects so releases
# can replace the main virtual host without removing the permanent redirects.
server {
    listen 80;
    server_name bunker-176-113-82-38.sslip.io www.bunker-vdk.ru;
    location /.well-known/acme-challenge/ { root /var/www/bunker-acme; }
    location / { return 308 https://bunker-vdk.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name bunker-176-113-82-38.sslip.io;
    ssl_certificate /etc/letsencrypt/live/bunker-176-113-82-38.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunker-176-113-82-38.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://bunker-vdk.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name www.bunker-vdk.ru;
    ssl_certificate /etc/letsencrypt/live/bunker-vdk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bunker-vdk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://bunker-vdk.ru$request_uri;
}
