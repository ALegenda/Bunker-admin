name: bunker-admin
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bunker
      POSTGRES_DB: bunker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set .env}
    command: postgres -c shared_buffers=32MB -c max_connections=40
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bunker -d bunker']
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 192m
    memswap_limit: 384m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set .env}
    volumes: ['minio-data:/data']
    ports: ['127.0.0.1:59000:9000']
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  postgres-data:
  minio-data:
