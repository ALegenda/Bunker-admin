name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://bunker:ci-local-password@127.0.0.1:55432/bunker
      POSTGRES_PASSWORD: ci-local-password
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_ACCESS_KEY: bunker-ci
      S3_SECRET_KEY: ci-local-storage-password
      S3_BUCKET: bunker
      AUTH_MODE: local
      NODE_ENV: test
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: docker compose up -d --wait postgres minio
      - run: npm test
      - if: always()
        run: docker compose logs --tail 50
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://bunker-vdk.ru
    steps:
      - uses: actions/checkout@v4
      - name: Check that this is still the latest master commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer master commit exists; skipping this deployment.'
          fi
      - name: Configure SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.HOSTER_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOSTER_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy verified commit to Hoster.kz
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.HOSTER_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTER_DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release_dir="/opt/bunker-production/releases/$GITHUB_SHA"
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=6)
          git archive --format=tar.gz "$GITHUB_SHA" > "$RUNNER_TEMP/source.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum source.tar.gz > SHA256SUMS)
          ssh "${ssh_options[@]}" "$target" "umask 077; mkdir -p '$release_dir/source'"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/SHA256SUMS" "$target:$release_dir/"
          ssh "${ssh_options[@]}" "$target" "set -e; cd '$release_dir'; sha256sum -c SHA256SUMS; tar -xzf source.tar.gz -C source; bash source/deploy/hoster-release.sh '$GITHUB_SHA'"
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 20 \
            https://bunker-vdk.ru/api/health
          echo "Deployed commit \`$GITHUB_SHA\` to https://bunker-vdk.ru" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
