name: Publish alternate static site to GitHub Pages

on:
  push:
    branches: [pages-static-access]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-static
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_BASE: /Bunker-admin/
      VITE_API_ORIGIN: https://bunker-vdk.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
